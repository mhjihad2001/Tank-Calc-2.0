name: Build & Publish Android Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Zero-PC Signed APK Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Automatic Permanent Keystore Management (Zero-PC Vault)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/app
          mkdir -p app

          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          DEFAULT_PASS="AutoKeystore@2026"
          DEFAULT_ALIAS="upload"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from KEYSTORE_BASE64 secret..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            ACTIVE_ALIAS="${SECRET_KEY_ALIAS:-$DEFAULT_ALIAS}"
            ACTIVE_STORE_PASS="${SECRET_KEYSTORE_PASSWORD:-$DEFAULT_PASS}"
            ACTIVE_KEY_PASS="${SECRET_KEY_PASSWORD:-$DEFAULT_PASS}"
          else
            # Query ALL releases (including hidden drafts) via GitHub REST API.
            # NOTE: `gh release view <tag>` can return 404 for draft releases because drafts have no published git tag.
            # Sorting by created_at ascending locks onto the original permanent keystore forever.
            VAULT_ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == "keystore-vault" or .name == "Permanent Signing Keystore (Do Not Delete)") | .assets[]? | select(.name == "release-keystore.jks")] | sort_by(.created_at) | .[0].id // empty')

            if [ -n "$VAULT_ASSET_ID" ]; then
              echo "Found existing permanent keystore asset (ID: $VAULT_ASSET_ID) in 'keystore-vault' draft release. Downloading..."
              REDIRECT_URL=$(curl -sS -o /dev/null -w '%{redirect_url}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${VAULT_ASSET_ID}")

              if [ -n "$REDIRECT_URL" ]; then
                curl -fsSL "$REDIRECT_URL" -o "$KEYSTORE_FILE"
              else
                gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${VAULT_ASSET_ID}" \
                  -H "Accept: application/octet-stream" > "$KEYSTORE_FILE"
              fi

              if [ ! -s "$KEYSTORE_FILE" ]; then
                echo "ERROR: Downloaded keystore from keystore-vault is empty! Aborting to prevent mismatched app signature."
                exit 1
              fi

              ACTIVE_ALIAS="${SECRET_KEY_ALIAS:-$DEFAULT_ALIAS}"
              ACTIVE_STORE_PASS="${SECRET_KEYSTORE_PASSWORD:-$DEFAULT_PASS}"
              ACTIVE_KEY_PASS="${SECRET_KEY_PASSWORD:-$DEFAULT_PASS}"
            else
              echo "First-time build: Generating permanent release keystore and storing in hidden 'keystore-vault' draft release..."
              keytool -genkey -v \
                -keystore "$KEYSTORE_FILE" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -alias "$DEFAULT_ALIAS" \
                -storepass "$DEFAULT_PASS" \
                -keypass "$DEFAULT_PASS" \
                -dname "CN=App, OU=Mobile, O=Dev, L=City, S=State, C=BD"

              # Also add 'app-release-key' alias in the same keystore so both 'upload' and 'app-release-key' work seamlessly
              keytool -genkey -v \
                -keystore "$KEYSTORE_FILE" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -alias "app-release-key" \
                -storepass "$DEFAULT_PASS" \
                -keypass "$DEFAULT_PASS" \
                -dname "CN=App, OU=Mobile, O=Dev, L=City, S=State, C=BD"

              gh release create keystore-vault "$KEYSTORE_FILE" \
                --draft \
                --title "Permanent Signing Keystore (Do Not Delete)" \
                --notes "Auto-generated permanent signing keystore. Do not delete this draft release."

              ACTIVE_ALIAS="${SECRET_KEY_ALIAS:-$DEFAULT_ALIAS}"
              ACTIVE_STORE_PASS="${SECRET_KEYSTORE_PASSWORD:-$DEFAULT_PASS}"
              ACTIVE_KEY_PASS="${SECRET_KEY_PASSWORD:-$DEFAULT_PASS}"
            fi
          fi

          # Verify keystore integrity and log signing SHA-256 fingerprint for auditability
          echo "Verifying signing keystore certificate fingerprint (alias: $ACTIVE_ALIAS):"
          keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$ACTIVE_ALIAS" -storepass "$ACTIVE_STORE_PASS" | grep -E "Alias name:|SHA256:"

          # Copy to root fallback path as well
          cp "$KEYSTORE_FILE" "$GITHUB_WORKSPACE/my-upload-key.jks"

          # Ensure debug.keystore exists for debugConfig validation
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ACTIVE_ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$ACTIVE_STORE_PASS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ACTIVE_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ACTIVE_KEY_PASS" >> "$GITHUB_ENV"

      - name: Read Version Metadata from version.json
        run: |
          if [ -f "version.json" ]; then
            VER_NAME=$(jq -r '.version_name // "1.0.0"' version.json)
            LATEST_BUILD=$(jq -r '.latest_build // 1' version.json)
            CHANGELOG_TEXT=$(jq -r '.changelog // "Automated release build."' version.json)
          else
            VER_NAME="1.0.0"
            LATEST_BUILD="1"
            CHANGELOG_TEXT="Initial release."
          fi

          echo "VERSION_NAME=$VER_NAME" >> "$GITHUB_ENV"
          echo "LATEST_BUILD=$LATEST_BUILD" >> "$GITHUB_ENV"
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG_TEXT"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

          APK_FOUND=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_FOUND" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: v${{ env.VERSION_NAME }}
          body: ${{ env.CHANGELOG }}
          draft: false
          make_latest: true
          files: |
            app-release.apk
            version.json
